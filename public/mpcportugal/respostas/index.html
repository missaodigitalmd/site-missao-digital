:root{--top:#ffac13;--base:#fe7003;--ink:#212121;--ink2:#404040;--ink3:#6b6b6b;--line:#e3e3e3;--soft:#fff7ea;--grid:rgba(0,0,0,.07);--navh:88px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.55;color:var(--ink);background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:55px 55px;padding-bottom:calc(24px + env(safe-area-inset-bottom));overflow-wrap:break-word}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:1.67vh;min-height:8px;background:linear-gradient(90deg,var(--top),var(--base));z-index:50}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid rgba(254,112,3,.55);outline-offset:2px}

/* cabeçalho: sobre a mesma grelha da página, sem faixa de cor própria */
header.top{padding:30px 0 6px}
.hero{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start;margin-top:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink2)}
.brand svg{width:32px;height:32px;flex:none}
h1{font-weight:900;text-transform:uppercase;font-size:clamp(28px,7.2vw,52px);line-height:1.06;margin:20px 0 6px;color:var(--ink2)}
h1 span{display:inline-block;margin-top:6px;padding:2px 14px 5px;background:linear-gradient(135deg,var(--top),var(--base));color:#fff}
.lead{font-size:clamp(16px,2.3vw,18px);color:var(--ink2);max-width:600px;margin:0}
.prog{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 10px 30px -18px rgba(33,33,33,.35)}
.prog .big{font-weight:900;font-size:40px;line-height:1;color:var(--ink)}
.prog .big small{font-weight:700;font-size:15px;color:var(--ink3);margin-left:6px}
.prog .trk{height:8px;border-radius:99px;background:#eee;margin:12px 0 10px;overflow:hidden}
.prog .trk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--top),var(--base));border-radius:99px;transition:width .4s ease}
.prog p{margin:0;font-size:13px;color:var(--ink3);line-height:1.45}
.prog p b{color:var(--ink)}
@media(min-width:800px){.hero{grid-template-columns:minmax(0,1fr) 280px;gap:40px}}

body.gate .hero,body.gate nav.tabs,body.gate .sent{display:none}
/* separadores: transparentes sobre a grelha; ficam foscos só quando colam ao topo */
.sent{height:1px;margin-top:20px}
nav.tabs{position:sticky;top:0;z-index:20;transition:background .2s,box-shadow .2s,border-color .2s;border-bottom:1px solid transparent}
nav.tabs.stuck{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);border-bottom-color:rgba(0,0,0,.08);box-shadow:0 8px 20px -16px rgba(0,0,0,.35)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 20px 8px;margin:0 -20px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;min-height:40px;border:1.5px solid #d6d6d6;background:#fff;border-radius:999px;padding:7px 15px;font:700 13.5px 'Montserrat',sans-serif;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.tab:hover{border-color:var(--ink)}
.tab[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab small{font-weight:600;color:var(--ink3);margin-left:6px}
.tab[aria-current=true] small{color:#ffd9a8}
.tab.done{border-color:#9fd3b0}
.tab.done small{color:#1e7a3c}
.tab.done[aria-current=true] small{color:#9be0b2}

section.pane{display:none;padding:26px 0 20px;scroll-margin-top:calc(var(--navh) + 8px)}
section.pane.on{display:block}
h2{font-weight:900;text-transform:uppercase;font-size:clamp(24px,5.4vw,34px);line-height:1.1;margin:0 0 8px;color:var(--ink)}
h2::after{content:"";display:block;width:64px;height:6px;margin-top:12px;background:linear-gradient(90deg,var(--top),var(--base))}
.why{color:var(--ink2);margin:14px 0 22px;max-width:680px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 16px;box-shadow:0 8px 24px -20px rgba(33,33,33,.4)}
.card h3{font-weight:800;font-size:17px;margin:0 0 14px;color:var(--ink)}
.field{margin:0 0 20px}
.field:last-child{margin-bottom:0}
label.l,.field>.l{display:block;font-weight:700;font-size:15px;margin:0 0 4px;color:var(--ink)}
.hint{display:block;font-weight:500;font-size:13px;color:var(--ink3);margin:0 0 8px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],textarea,select{width:100%;font:500 16px 'Montserrat',sans-serif;color:var(--ink);background:#fff;border:1.5px solid #c9c9c9;border-radius:10px;padding:12px 14px;min-height:46px}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(254,112,3,.3);border-color:var(--base)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;max-width:100%;border:1.5px solid #c9c9c9;border-radius:10px;padding:9px 14px;cursor:pointer;background:#fff;font-weight:600;font-size:15px;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt:has(input:checked){border-color:var(--base);background:var(--soft)}
.opt:has(input:focus-visible){outline:3px solid rgba(254,112,3,.55);outline-offset:2px}
.opt input{accent-color:var(--base);width:20px;height:20px;margin:0;flex:none}
.other{margin-top:8px}
.file{border:1.5px dashed #b5b5b5;border-radius:12px;padding:14px;background:rgba(255,255,255,.85)}
.file{position:relative;transition:border-color .15s,background .15s}
.file.drag{border-color:var(--base);background:var(--soft)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.file .btn.sm{margin-top:2px}
.file ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.file ul.fl{list-style:none;padding:0;display:grid;gap:8px}
.fl li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.fl .th{flex:none;width:44px;height:44px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:11px;color:var(--ink2)}
.fl .th img{width:100%;height:100%;object-fit:cover}
.fl .nm{flex:1;min-width:0;font-weight:600;font-size:14px;color:var(--ink);overflow-wrap:anywhere;line-height:1.3}
.fl .nm small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.fl li.err .nm small{color:#b42318}
.fl .bar2{display:block;height:5px;border-radius:9px;background:#eee;margin-top:5px;overflow:hidden}
.fl .bar2 b{display:block;height:100%;background:linear-gradient(90deg,var(--top),var(--base))}
.note{background:var(--soft);border-left:5px solid var(--base);border-radius:8px;padding:12px 16px;margin:0 0 16px;font-size:14.5px;color:var(--ink2)}
.note b{color:var(--ink)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:0 0 6px}
.role{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:14px}
.role b{display:block;font-weight:800;margin-bottom:4px}
.rep{border:1px solid var(--line);border-radius:16px;margin:0 0 14px;background:#fff;overflow:hidden;box-shadow:0 8px 24px -20px rgba(33,33,33,.4)}
.rep>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#f6f6f6;border-bottom:1px solid var(--line);font-weight:800;min-width:0}
.rep>.hd span{min-width:0;overflow-wrap:anywhere}
.rep>.bd{padding:18px 20px}
.btn{font:800 15px 'Montserrat',sans-serif;border:0;border-radius:999px;padding:12px 24px;min-height:46px;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,var(--top),var(--base));transition:transform .15s,filter .15s}
.btn.alt{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.btn.ghost{background:#fff;border:1.5px solid #c9c9c9;color:var(--ink2);font-weight:700}
.btn.sm{padding:6px 14px;font-size:13px;min-height:36px;flex:none}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.btn:active{transform:none}
.bar{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.fim{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
footer{padding:22px 0 24px;font-size:12.5px;color:var(--ink3)}
footer p{margin:0;max-width:640px}

.qa{padding:10px 0 10px 14px;border-left:3px solid transparent;margin:0 0 6px}
.qa+.qa{border-top:1px solid #f0f0f0}
.qa .q{font-weight:700;font-size:13.5px;color:var(--ink3);margin:0 0 3px}
.qa .a{white-space:pre-wrap;font-size:15.5px;color:var(--ink)}
.qa .nada{color:#a0a0a0;font-style:italic}
.qa.chg{border-left-color:var(--base);background:linear-gradient(90deg,var(--soft),transparent 70%)}
.qa .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--base);color:#fff;font-size:11px;font-weight:800}
.fl a{color:var(--ink);text-decoration-color:var(--base)}
/* estado de gravação: fica no separador colante, sempre visível, sem tapar conteúdo */
.savest{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3);padding:0 0 8px;line-height:1.2}
.savest::before{content:"";width:8px;height:8px;border-radius:50%;background:#34c46a;flex:none}
.savest.wait::before{background:var(--top)}
.savest.off::before{background:#e5484d}
.savest.idle::before{background:#b0b0b0}

@media(max-width:560px){
  .wrap{padding:0 16px}
  #tabs{padding:10px 16px;margin:0 -16px}
  header.top{padding-top:22px}
  .card{padding:16px}
  .rep>.bd{padding:16px}
  .opt{flex:1 1 100%}
  .bar .btn{flex:1}
  .fim .btn{flex:1 1 100%}
  .prog{padding:16px}
  #tabs{padding-bottom:6px}
  .prog .big{font-size:34px}
}
@media(max-height:480px){:root{--navh:52px}#tabs{padding-top:6px;padding-bottom:6px}.tab{min-height:36px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media print{nav.tabs,.bar,.btn,.prog,.sent{display:none}section.pane{display:block!important;break-before:page}body::after{display:none}body{background-image:none}}

<script>// As perguntas do formulário, um bloco por página do site. Edite aqui e rode `python src/build.py`.
// Campo condicional: passe {if:['id_do_campo','Valor']} como último argumento.
const f=(ty,id,l,h,o,x)=>Object.assign({ty,id,l,h,o},x||{});
const T=(id,l,h,x)=>f('text',id,l,h,0,x),A=(id,l,h,x)=>f('area',id,l,h,0,x),E=(id,l,h,x)=>f('email',id,l,h,0,x),P=(id,l,h,x)=>f('tel',id,l,h,0,x);
const R=(id,l,o,h,x)=>f('radio',id,l,h,o,x),C=(id,l,o,h,x)=>f('check',id,l,h,o,Object.assign({other:1},x||{})),F=(id,l,h,x)=>f('file',id,l,h,0,x),N=h=>({ty:'note',h});
const S0=(id,l,o,h,x)=>f('select',id,l,h,o,x);
const SN=['Sim','Não','Ainda não sei'];
const S=[
{k:'comecar',t:'Antes de começar',why:'Este formulário recolhe tudo o que é preciso para construir o site da MPC Portugal. Cada separador é uma página do site. Pode responder por partes: o que escrever guarda-se sozinho, e pode voltar a este mesmo link sempre que tiver informação nova, sem recomeçar nem enviar nada. Se uma pergunta não se aplicar ou ainda não tiver resposta, deixe em branco ou escreva "não sei".',items:[
 N('<b>Prazo:</b> pedimos o preenchimento até <b>29 de novembro</b>, para que o site possa estar pronto até 20 de dezembro. Não precisa de ser perfeito. Uma resposta curta hoje vale mais do que uma resposta perfeita depois.'),
 {g:'Quem está a preencher',f:[
  T('quem_nome','Nome completo'),T('quem_funcao','Função na MPC Portugal'),E('quem_email','E-mail'),P('quem_tel','Telemóvel ou WhatsApp (com indicativo)','Exemplo: +351 912 345 678')]},
 {g:'Decisões do projeto',f:[
  T('dec_aprova','Quem aprova o site antes de ser publicado?','Pessoa ou grupo (por exemplo: o Conselho Diretivo).'),
  T('dec_contacto','Quem será o contacto principal da MPC durante o projeto?'),
  R('dec_conselho','O Conselho Diretivo já aprovou o projeto do site?',['Sim','Ainda não','Reunião marcada']),
  T('dec_data','Se há reunião marcada, para quando?')]}
]},
{k:'geral',t:'Geral e legal',why:'Estes dados aparecem no rodapé e na página de doação. Respondemos só com o que existe hoje: o que ainda estiver a ser organizado não é problema.',items:[
 {g:'A organização',f:[
  T('org_nome','Nome oficial completo da MPC em Portugal'),T('org_curto','Nome curto ou sigla usada no dia a dia','Exemplo: MPC Portugal.'),
  T('org_nif','NIF da organização, se já existir'),
  S0('org_tipo','Natureza jurídica',['Associação privada sem fins lucrativos','IPSS (Instituição Particular de Solidariedade Social)','Pessoa coletiva religiosa inscrita','Fundação','Ainda a formalizar','Outra','Ainda não sei'],'Escolha a que estiver nos documentos oficiais da MPC.'),
  T('org_tipo_outro','Qual?',null,{if:['org_tipo','Outra']}),
  T('org_ano','Ano em que começou em Portugal'),
  T('org_morada','Morada da sede'),
  E('org_email','E-mail geral da organização'),P('org_tel','Telefone da organização')]},
 {g:'Dinheiro e recibos',f:[
  N('A parte fiscal e contabilística da MPC pode ainda estar a ser organizada, e não há problema nenhum. No site só escrevemos o que for verdade.'),
  R('leg_recibo','Hoje a MPC emite recibo de donativo?',SN),
  R('leg_contab','Há alguém hoje que cuida da parte contábil?',['Sim','Ainda não']),
  T('leg_contab_q','Nome e contacto dessa pessoa',null,{if:['leg_contab','Sim']})]},
 {g:'Identidade visual da MPC Portugal',f:[
  F('id_logo','Logótipo da MPC Portugal','Pedimos o ficheiro original (SVG ou PNG de alta resolução). Pode anexar também PDF ou ZIP.'),
  F('id_manual','Manual de identidade ou outros materiais da marca, se existirem'),
  T('id_cores','Cores oficiais','Códigos ou nomes, se souber.'),T('id_fontes','Tipo de letra oficial, se existir'),
  A('id_ref','Sites ou páginas de que goste, como inspiração','Ligações e o que lhe agrada em cada uma.'),
  A('id_nao','Há algo que NÃO quer ver no site?','Cores, imagens, tom, expressões.')]},
 {g:'Endereço do site (domínio)',f:[
  N('Sugerimos que o domínio seja registado em nome da MPC, para que o endereço pertença sempre à organização. Marque as opções de que gosta. A disponibilidade será confirmada antes do registo.'),
  C('dom_op','Opções de endereço',['mocidadeparacristo.pt','mpcportugal.pt','mpc-portugal.pt','mpcpt.pt','mocidadeparacristo.com.pt','mocidadeparacristo.org','mocidadeparacristo.com'],'Pode escolher mais do que uma.'),
  R('dom_tem','A MPC já tem domínio ou alojamento (hosting)?',SN),
  T('dom_tem_qual','Se sim, qual o endereço e quem o gere?'),
  T('dom_email','A MPC usa e-mails com o endereço do site (por exemplo, nome@dominio.pt)?')]}
]},
{k:'inicio',t:'Início',why:'A página inicial é a primeira que a pessoa vê. Precisa de dizer, em poucos segundos, quem é a MPC Portugal.',items:[
 {g:'Provas e destaques',f:[
  A('ini_numeros','Números que mostram o trabalho da MPC','Exemplo: jovens alcançados num ano, escolas, núcleos. Escreva só números reais e a data a que se referem.'),
  A('ini_testemunho','Um testemunho curto de alguém que foi alcançado ou formado pela MPC','Com nome (ou iniciais) e autorização da pessoa.'),
  A('ini_eventos','Próximos eventos, campos ou atividades a destacar','Nome, data, local e ligação de inscrição, se houver.'),
  F('ini_media','Fotografias ou vídeos para a página inicial','Pedimos os originais, sem compressão.')]}
]},
{k:'quem',t:'Quem somos e visão',why:'Esta página explica a história, o que a MPC acredita e para onde vai. Respostas simples e verdadeiras funcionam melhor do que textos longos.',items:[
 {g:'História e identidade',f:[
  A('qs_historia','Resumo da história da MPC Portugal','Como começou, quando, e os marcos mais importantes.'),
  A('qs_missao','Missão','O que a MPC faz e para quem.'),
  A('qs_visao','Visão','Onde a MPC quer chegar. Se existir uma frase oficial, escreva-a como está.'),
  A('qs_valores','Valores e princípios'),
  R('qs_fe','Existe uma declaração de fé que deva aparecer no site?',SN),
  F('qs_fe_f','Se existir, anexe-a')]},
 {g:'Onde atua',f:[

// Página de leitura de Navas. Mesma fonte de perguntas (perguntas.js), só leitura, com destaque do que mudou.
const SB='https://wpgjlptwoydiejbphmhj.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwZ2pscHR3b3lkaWVqYnBobWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzA1MDYsImV4cCI6MjA4NjQwNjUwNn0.JfjvVYWbbVnickEwRU8j7aTgqncZm2e9tolhI0yq7iI';
const FN=SB+'/functions/v1/mpc-briefing';
const hk=(location.hash.match(/a=([A-Za-z0-9_-]+)/)||[])[1];
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
if(hk)LS('mpcpt-a',hk);
const AT=hk||LS('mpcpt-a')||'';
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb=n=>n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';
const fdt=d=>new Date(d).toLocaleString('pt-PT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
let BR=null,SNAP={},showEmpty=false,cur=0;
const txt=v=>Array.isArray(v)?v.join('; '):String(v==null?'':v);
const has=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
const val=(x,get)=>{let v=get(x.id);if(x.other&&get(x.id+'__outro'))v=(Array.isArray(v)?v:[]).concat(['Outro: '+get(x.id+'__outro')]);return v};
const arqs=(sc,x)=>BR.arquivos.filter(a=>a.escopo===(sc==='_'?x.id:sc+'.'+x.id));
const sk=(sc,id)=>sc+'|'+id;
const nowOf=(x,get,sc)=>x.ty==='file'?arqs(sc,x).map(a=>a.id).join(','):txt(val(x,get));

function snapOf(){const m={};S.forEach(s=>s.items.forEach(it=>{if(it.ty==='note')return;
  const add=(x,get,sc)=>{if(x.ty!=='note')m[sk(sc,x.id)]=nowOf(x,get,sc)};
  if(it.rep)(BR.data['rep_'+it.rep]||[]).forEach(row=>it.f.forEach(x=>add(x,k=>row[k],row._id)));else it.f.forEach(x=>add(x,k=>BR.data[k],'_'))}));return m}
const mudou=(sc,x,now)=>{const k=sk(sc,x.id);return k in SNAP?SNAP[k]!==now:now!==''};

function answer(x,get,sc){
  const v=val(x,get),now=nowOf(x,get,sc),filled=x.ty==='file'?arqs(sc,x).length>0:has(v);
  if(!filled&&!showEmpty)return null;
  const ch=mudou(sc,x,now);
  const d=el('div','qa'+(ch?' chg':'')+(filled?'':' vazio'));
  d.append(el('div','q',esc(x.l)+(ch?' <b class="tag">novo</b>':'')));
  if(x.ty==='file'&&filled){const ul=el('ul','fl');arqs(sc,x).forEach(a=>{const li=el('li');const th=el('span','th');
      if(/^image\//.test(a.mime||'')&&a.url)th.innerHTML='<img alt="" loading="lazy" src="'+esc(a.url)+'">';else th.textContent=(a.nome.split('.').pop()||'').slice(0,4).toUpperCase();
      li.append(th,el('span','nm','<a target="_blank" rel="noopener" href="'+esc(a.url||'#')+'">'+esc(a.nome)+'</a><small>'+kb(a.bytes)+'</small>'));ul.append(li)});d.append(ul)}
  else d.append(el('div','a',filled?esc(txt(v)):'<span class="nada">sem resposta</span>'));
  return d}

function render(){
  const tabs=$('#tabs'),main=$('#main');tabs.innerHTML='';main.innerHTML='';let ta=0,tb=0;
  S.forEach((s,i)=>{let a=0,b=0,ch=0;
    const p=el('section','pane'+(i===cur?' on':''));p.id='p-'+s.k;p.append(el('h2','',esc(s.t)));
    s.items.forEach(it=>{if(it.ty==='note')return;
      const blk=(title,fs,get,sc)=>{const c=el('div','card');c.append(el('h3','',esc(title)));let any=0;
        fs.forEach(x=>{if(x.ty==='note'||(x.if&&get(x.if[0])!==x.if[1]))return;b++;
          const v=val(x,get);if(x.ty==='file'?arqs(sc,x).length>0:has(v))a++;
          const d=answer(x,get,sc);if(d){c.append(d);any=1;if(d.classList.contains('chg'))ch++}});
        return any?c:null};
      if(it.rep){(BR.data['rep_'+it.rep]||[]).forEach((row,ix)=>{const c=blk(it.title+' '+(ix+1)+(row.nome?': '+row.nome:''),it.f,k=>row[k],row._id);if(c)p.append(c)})}
      else{const c=blk(it.g,it.f,k=>BR.data[k],'_');if(c)p.append(c)}});
    if(!p.querySelector('.card'))p.append(el('div','note','Ainda sem respostas neste separador.'));
    ta+=a;tb+=b;
    const t=el('button','tab',esc(s.t)+'<small>'+a+'/'+b+(ch?' · '+ch+' novo'+(ch>1?'s':''):'')+'</small>');t.type='button';t.setAttribute('aria-current',i===cur?'true':'false');
    t.classList.toggle('done',a>0&&a===b);t.onclick=()=>{cur=i;render();window.scrollTo({top:Math.max(0,$('#sent').offsetTop-8)})};tabs.append(t);main.append(p)});
  $('#pa').textContent=ta;$('#pb').textContent=tb;$('#pbar').style.width=(tb?Math.round(100*ta/tb):0)+'%';
  const bar=el('div','fim');
  [['Copiar tudo em Markdown','btn',copiar],['Baixar cópia (JSON)','btn alt',baixar],[showEmpty?'Esconder perguntas sem resposta':'Mostrar perguntas sem resposta','btn alt',()=>{showEmpty=!showEmpty;render()}],['Marcar tudo como visto','btn alt',visto]].forEach(([tt,c,fn])=>{const q=el('button',c,tt);q.type='button';q.onclick=fn;bar.append(q)});
  main.append(bar);
  const sc=$('#tabs'),tt=document.querySelectorAll('.tab')[cur];if(tt)sc.scrollTo({left:tt.offsetLeft-(sc.clientWidth-tt.offsetWidth)/2})}

function md(){const out=['# Respostas do briefing da MPC Portugal','Última gravação: '+fdt(BR.atualizadoEm)];
  S.forEach(s=>{out.push('\n## '+s.t);s.items.forEach(it=>{if(it.ty==='note')return;
    const put=(x,get,sc)=>{if(x.ty==='note'||(x.if&&get(x.if[0])!==x.if[1]))return;
      if(x.ty==='file'){const f=arqs(sc,x);if(f.length)out.push('- '+x.l+': '+f.map(a=>a.nome+' ('+a.url+')').join('; '));return}
      const v=val(x,get);if(has(v))out.push('- '+x.l+': '+txt(v))};
    if(it.rep)(BR.data['rep_'+it.rep]||[]).forEach((row,i)=>{out.push('\n### '+it.title+' '+(i+1));it.f.forEach(x=>put(x,k=>row[k],row._id))});
    else{out.push('\n### '+it.g);it.f.forEach(x=>put(x,k=>BR.data[k],'_'))}})});return out.join('\n')}
function copiar(){navigator.clipboard.writeText(md()).then(()=>alert('Copiado. As ligações dos anexos expiram em 1 hora.'),()=>alert('Não foi possível copiar.'))}
function baixar(){const b=new Blob([JSON.stringify({em:new Date().toISOString(),data:BR.data,arquivos:BR.arquivos.map(a=>({escopo:a.escopo,nome:a.nome,bytes:a.bytes}))},null,2)],{type:'application/json'});const a=el('a');a.href=URL.createObjectURL(b);a.download='briefing-mpc-portugal.json';a.click()}
function visto(){SNAP=snapOf();LS('mpcpt-snap',JSON.stringify(SNAP));LS('mpcpt-visto',new Date().toISOString());cabecalho();render()}
function cabecalho(){const v=LS('mpcpt-visto'),cur=snapOf();
  const n=Object.keys(cur).filter(k=>k in SNAP?SNAP[k]!==cur[k]:cur[k]!=='').length;
  $('#resumo').textContent=!BR.version?'O Mark ainda não escreveu nada.':(v?(n?n+' resposta'+(n>1?'s':'')+' nova'+(n>1?'s':'')+' ou alterada'+(n>1?'s':'')+' desde a sua última visita ('+fdt(v)+').':'Nada mudou desde a sua última visita ('+fdt(v)+').'):'Primeira visita: tudo o que o Mark escreveu aparece abaixo.');
  $('#ult').textContent=BR.version?'Última gravação: '+fdt(BR.atualizadoEm):'Sem gravações ainda.'}

async function boot(){
  new IntersectionObserver(([e])=>$('#nav').classList.toggle('stuck',!e.isIntersecting)).observe($('#sent'));
  if(!AT){$('#resumo').textContent='Falta o seu link de leitura.';return}
  try{
    const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json',apikey:ANON,authorization:'Bearer '+ANON},body:JSON.stringify({acao:'admin_ler',adminToken:AT})});
    if(!r.ok)throw new Error(r.status);BR=await r.json()}
  catch(e){$('#resumo').textContent='Não foi possível abrir. Confira o link ou tente outra vez.';return}
  try{SNAP=JSON.parse(LS('mpcpt-snap')||'{}')}catch(e){SNAP={}}
  cabecalho();render();
  if(!LS('mpcpt-visto')){LS('mpcpt-visto',new Date().toISOString());LS('mpcpt-snap',JSON.stringify(snapOf()))}}
boot();
</script>

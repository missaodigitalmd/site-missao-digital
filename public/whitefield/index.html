<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>George Whitefield</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --bg:#110c07; --terra:#231a11; --tinta:#8c6b3f; --tinta2:#5a4329; --ouro:#e3b45b; --vela:#ffcf7a;
  --creme:#efe2c4; --creme2:#c9b48e; --sangue:#8a2414;
  --titulo:'IM Fell English SC',Georgia,serif; --fell:'IM Fell English',Georgia,serif; --corpo:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
body.cursor{cursor:default}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--creme);font-family:var(--corpo)}
#mapa{position:absolute;inset:0}
#img{position:absolute;inset:0;pointer-events:none}
#sombra{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(17,12,7,.85) 0%,rgba(17,12,7,.5) 30%,rgba(17,12,7,0) 46%)}
.quadro{position:absolute;inset:0;background-size:cover;background-position:center;will-change:clip-path}
.quadro::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,7,4,.92) 0%,rgba(10,7,4,.55) 32%,rgba(10,7,4,0) 55%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.quadro.kb{animation:kb 26s ease-out forwards}
@keyframes kb{from{background-size:112%}to{background-size:100%}}
#txt{position:absolute;inset:0;pointer-events:none}
#txt > *{position:absolute}
#grao{position:absolute;inset:-50%;pointer-events:none;opacity:.10;mix-blend-mode:overlay;animation:grao 1s steps(6) infinite}
@keyframes grao{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#vinheta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 50%,transparent 50%,rgba(0,0,0,.75) 100%)}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0;pointer-events:none}
#selos{position:absolute;left:120px;bottom:70px;display:flex;gap:26px;opacity:0}
.selo{width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);display:grid;place-items:center;font-family:var(--titulo);font-size:30px;color:var(--tinta2);transition:all .6s}
.selo.on{color:var(--bg);background:var(--ouro);border-color:var(--ouro)}
.selo.alerta{background:#b8862e;border-color:#b8862e;color:var(--bg)}
.selo.nao{background:var(--sangue);border-color:#c0392b;color:var(--creme)}

.kick{font-family:var(--titulo);font-size:30px;letter-spacing:.18em;color:var(--ouro)}
.h1{font-family:var(--titulo);font-size:150px;line-height:.95;color:var(--creme);letter-spacing:.01em}
.h2{font-family:var(--titulo);font-size:84px;line-height:1;color:var(--creme)}
.h3{font-family:var(--titulo);font-size:56px;line-height:1.05;color:var(--creme)}
.p{font-size:42px;line-height:1.3;color:var(--creme2);font-weight:400}
.p b{color:var(--creme);font-weight:600}
.cit{font-family:var(--fell);font-style:italic;font-size:54px;line-height:1.25;color:var(--creme)}
.cit.m{font-size:46px}
.fonte{font-family:var(--corpo);font-size:28px;letter-spacing:.06em;color:var(--tinta);font-style:normal}
.num{font-family:var(--titulo);font-size:200px;line-height:.9;color:var(--ouro);font-variant-numeric:lining-nums}
.num.m{font-size:130px}
.rot{font-family:var(--titulo);font-size:34px;letter-spacing:.12em;color:var(--creme2)}
.linha{height:2px;background:linear-gradient(90deg,var(--ouro),transparent);transform-origin:left}
.med{border-radius:50%;background-size:cover;background-position:center 20%;border:3px solid var(--ouro);box-shadow:0 0 0 10px rgba(227,180,91,.12),0 30px 80px rgba(0,0,0,.7)}
.med-cap{font-family:var(--titulo);font-size:28px;letter-spacing:.1em;color:var(--creme2);text-align:center}
.cartao{border-left:3px solid var(--ouro);padding:6px 0 6px 40px}
.cartao.alerta{border-color:#c99436}
.cartao.nao{border-color:#c0392b}
.lista div{font-family:var(--fell);font-size:50px;line-height:1.2;color:var(--creme);margin-bottom:34px;padding-left:70px;position:relative}
.lista div span{position:absolute;left:0;top:2px;font-family:var(--titulo);color:var(--ouro);font-size:46px}
#inicio{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;text-align:center}
#inicio .rot{opacity:.7}
#notas{position:fixed;left:0;right:0;bottom:0;background:rgba(10,7,4,.94);color:#e8dcc0;font:20px/1.4 Georgia,serif;padding:14px 24px;display:none;z-index:10;border-top:1px solid #5a4329}
#notas b{color:#e3b45b}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--ouro);opacity:.35;width:0}
/* toque: celular e tablet */
html,body{touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#nav{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:8px;z-index:20;display:none;gap:10px;opacity:.55}
#nav button{width:44px;height:44px;border-radius:50%;background:#00000088;border:1px solid #e3b45b55;color:#efe2c4;font:400 28px/40px Georgia,serif;padding:0}
#nav button:active{background:#e3b45b44}
#gire{display:none}
@media (pointer:coarse){#nav{display:flex}#grao{display:none}body{cursor:default}}
@media (pointer:coarse) and (orientation:portrait){#gire{display:flex;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:32px;text-align:center;background:#110c07f2;color:#efe2c4;font:400 22px/1.4 Georgia,serif}#gire b{font-size:54px;color:#e3b45b;font-weight:400}}
</style>
</head>
<body>
<div id="palco">
  <svg id="mapa" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="gradMancha"><stop offset="0" stop-color="#9b2a16" stop-opacity=".95"/><stop offset=".55" stop-color="#6e1a0c" stop-opacity=".75"/><stop offset="1" stop-color="#3a0d05" stop-opacity="0"/></radialGradient>
      <radialGradient id="gLuz"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset=".35" stop-color="#e3b45b" stop-opacity=".35"/><stop offset="1" stop-color="#e3b45b" stop-opacity="0"/></radialGradient>
      <mask id="mRevela"><rect width="1920" height="1080" fill="#000"/><circle id="revela" cx="0" cy="0" r="0" fill="#fff" filter="url(#fBorda)"/></mask>
      <filter id="fBorda"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="140"/></filter>
      <filter id="fTinta"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
    </defs>
    <g id="gMapa" mask="url(#mRevela)">
      <path id="grade" fill="none" stroke="#3b2c1b" stroke-width="1" stroke-dasharray="2 6"/>
      <path id="terra" fill="var(--terra)" stroke="var(--tinta)" stroke-width="1.6" filter="url(#fTinta)"/>
    </g>
    <g id="gMancha"></g>
    <g id="gRotas"></g>
    <g id="gOndas"></g>
    <g id="gFrank"></g>
    <g id="gPontos"></g>
    <g id="gNavio"><path id="navio" d="M-16 4 L16 4 L11 11 L-11 11 Z M0 -18 L0 4 M0 -16 L12 0 L0 0 Z M0 -12 L-10 0 L0 0 Z" fill="#e3b45b" stroke="#e3b45b" stroke-width="2" opacity="0"/></g>
  </svg>
  <div id="sombra"></div>
  <div id="img"></div>
  <div id="txt"></div>
  <div id="selos"><div class="selo">I</div><div class="selo">II</div><div class="selo">III</div><div class="selo">IV</div><div class="selo">V</div></div>
  <div id="vinheta"></div>
  <svg id="grao" width="200%" height="200%"><filter id="fGrao"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#fGrao)"/></svg>
  <div id="flash"></div>
  <div id="prog"></div>
  <div id="inicio"><div><div class="kick" style="margin-bottom:30px">História da Igreja 4</div><div class="h2">George Whitefield</div><div class="rot" style="margin-top:50px">pressione → para começar</div></div></div>
</div>
<div id="notas"></div>
<nav id="nav" aria-label="Navegação"><button id="nav-ant" aria-label="Voltar">‹</button><button id="nav-tela" aria-label="Tela cheia">⛶</button><button id="nav-prox" aria-label="Avançar">›</button></nav>
<div id="gire"><b>⟳</b>Gire o celular para assistir deitado.</div>

<script src="assets/lib/d3-array.min.js"></script>
<script src="assets/lib/d3-geo.min.js"></script>
<script src="assets/lib/topojson-client.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/land-50m.js"></script>
<script>
// ponytail: um arquivo só; o estado S guarda o mundo (mapa), e cada passo só anima S e o texto
const W=1920,H=1080, $=s=>document.querySelector(s), palco=$('#palco');
function ajusta(){const k=Math.min(innerWidth/W,innerHeight/H);palco.style.transform=`translate(${(innerWidth-W*k)/2}px,${(innerHeight-H*k)/2}px) scale(${k})`}
addEventListener('resize',ajusta);ajusta();

/* ---------- lugares e rotas ---------- */
const P={
  gloucester:{c:[-2.24,51.86],lab:'Gloucester',dx:-18,dy:-14,a:'end',k0:3},
  oxford:{c:[-1.26,51.75],lab:'Oxford',dx:18,dy:-14,k0:3},
  kingswood:{c:[-2.48,51.46],lab:'Kingswood · Bristol',dx:-18,dy:34,a:'end',k0:3},
  londres:{c:[-0.12,51.51],lab:'Londres',dx:18,dy:34,k0:3},
  savannah:{c:[-81.09,32.08],lab:'Savannah · Bethesda',dx:-18,dy:8,a:'end',k0:1},
  charleston:{c:[-79.93,32.78],lab:'Charleston',dx:18,dy:24,k0:2},
  filadelfia:{c:[-75.16,39.95],lab:'Filadélfia',dx:-18,dy:8,a:'end',k0:2},
  novaiorque:{c:[-74.0,40.71],lab:'Nova York',dx:18,dy:26,k0:2},
  newport:{c:[-71.31,41.49],lab:'Newport',dx:18,dy:28,k0:2.5},
  boston:{c:[-71.06,42.36],lab:'Boston',dx:18,dy:8,k0:1},
  northampton:{c:[-72.64,42.33],lab:'Northampton',dx:-18,dy:-14,a:'end',k0:2.5},
  cambuslang:{c:[-4.16,55.81],lab:'Cambuslang',dx:-18,dy:-14,a:'end',k0:1},
  newburyport:{c:[-70.88,42.81],lab:'Newburyport',dx:18,dy:-12,k0:1},
};
const ROT={
  ida:['gloucester','oxford'],
  travessia1:['londres',[-30,47],'savannah'],
  turne1740:['savannah','charleston','filadelfia','novaiorque','newport','boston','northampton','novaiorque','filadelfia'],
  escocia:['londres','cambuslang'],
  fim:['boston','newburyport'],
};
const portos=['savannah','filadelfia','boston','charleston','novaiorque'];
for(let i=0;i<13;i++){const am=portos[i%5],ida=i%2==0,lat=44+((i*7)%9)-4;ROT['x'+i]=ida?['londres',[-35,lat],am]:[am,[-35,lat+1.5],'londres']}

/* ---------- estado ---------- */
let S;
function novoS(){S={cam:{lon:-40,lat:42,k:1,ox:150,oy:0},rev:{r:0,at:'gloucester'},pt:{},rt:{},onda:{},mancha:{r:0},navio:{o:0,rota:null},frank:{t:0,o:0}};
  for(const k in P)S.pt[k]={o:0,g:0,lab:1};for(const k in ROT)S.rt[k]={t:0,o:1};for(const k in P)S.onda[k]=0}
novoS();

/* ---------- mapa ---------- */
const proj=d3.geoMercator(), base=d3.geoMercator().fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[-88,24],[8,62]]});
const S0=base.scale(), path=d3.geoPath(proj); let terra,grade=d3.geoGraticule().step([10,10])();
terra=topojson.feature(LAND,LAND.objects.land);
function cam(){const c=S.cam;proj.scale(S0*c.k).translate([0,0]).clipExtent(null);const p=proj([c.lon,c.lat]);proj.translate([W/2+c.ox-p[0],H/2+c.oy-p[1]]).clipExtent([[-60,-60],[W+60,H+60]])}
const NS='http://www.w3.org/2000/svg', el=(t,a,pai)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);pai&&pai.appendChild(e);return e};
const amostra={};function geo(id){if(amostra[id])return amostra[id];const w=ROT[id].map(x=>typeof x=='string'?P[x].c:x),out=[];
  for(let i=0;i<w.length-1;i++){const f=d3.geoInterpolate(w[i],w[i+1]);for(let j=0;j<=40;j++)if(i==0||j>0)out.push(f(j/40))}return amostra[id]=out}
// elementos persistentes
const ePt={},eRt={},eOn={};
for(const k in P){const g=el('g',{},$('#gPontos'));ePt[k]={g,luz:el('circle',{r:40,fill:'url(#gLuz)'},g),dot:el('circle',{r:7,fill:'#e3b45b',stroke:'#110c07','stroke-width':2},g),
  t:Object.assign(el('text',{'font-family':"'IM Fell English SC',serif",'font-size':30,fill:'#efe2c4','text-anchor':P[k].a||'start',style:'paint-order:stroke;stroke:#110c07;stroke-width:6px;letter-spacing:.06em'},g),{textContent:P[k].lab})};
  const go=el('g',{},$('#gOndas'));eOn[k]=[0,1,2].map(()=>el('circle',{fill:'none',stroke:'#e3b45b','stroke-width':2},go))}
for(const k in ROT)eRt[k]=el('path',{fill:'none',stroke:k.startsWith('x')?'#c9a46a':'#e3b45b','stroke-width':k.startsWith('x')?2:3,'stroke-dasharray':k.startsWith('x')?'':'10 7','stroke-linecap':'round'},$('#gRotas'));
const eMancha=el('circle',{fill:'url(#gradMancha)'},$('#gMancha'));
const gF=$('#gFrank'), eSemi=el('path',{fill:'rgba(227,180,91,.10)',stroke:'#e3b45b','stroke-width':2},gF), eRaio=el('line',{stroke:'#ffcf7a','stroke-width':2,'stroke-dasharray':'6 6'},gF), gGente=el('g',{},gF);
const gente=[];for(let i=0;i<900;i++){const r=Math.sqrt(Math.random()),a=Math.PI+Math.random()*Math.PI;gente.push({r,a,e:el('circle',{r:2.4,fill:'#efe2c4',opacity:0},gGente)})}
let ultimaCam='';
function xy(k){cam();return proj(P[k].c)}
function desenha(forca){
  if(!terra)return;cam();const c=S.cam,ck=[c.lon,c.lat,c.k,c.ox,c.oy].join();
  if(forca||ck!=ultimaCam){$('#terra').setAttribute('d',path(terra)||'');$('#grade').setAttribute('d',path(grade)||'');ultimaCam=ck}
  const rv=xy(S.rev.at),rc=$('#revela'),gm=$('#gMapa'),aberto=S.rev.r>=1e5;if(aberto!=gm._aberto){gm._aberto=aberto;aberto?gm.removeAttribute('mask'):gm.setAttribute('mask','url(#mRevela)')}if(!aberto){rc.setAttribute('cx',rv[0]);rc.setAttribute('cy',rv[1]);rc.setAttribute('r',S.rev.r)}
  const tempo=performance.now()/1000;
  for(const k in P){const s=S.pt[k],e=ePt[k],[x,y]=xy(k);e.g.setAttribute('transform',`translate(${x},${y})`);e.g.setAttribute('opacity',s.o);
    e.luz.setAttribute('r',20+s.g*90+Math.sin(tempo*6+x)*s.g*4);e.luz.setAttribute('opacity',.25+s.g*.75);
    const lv=S.cam.k>=P[k].k0?s.lab:0;e.t.setAttribute('x',P[k].dx);e.t.setAttribute('y',P[k].dy);e.t.setAttribute('opacity',lv);
    eOn[k].forEach((c,j)=>{const f=(tempo*.35+j/3)%1;c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',10+f*170);c.setAttribute('opacity',S.onda[k]*(1-f)*.8)})}
  for(const k in ROT){const s=S.rt[k];if(s.t<=0){eRt[k].setAttribute('d','');continue}const g=geo(k),n=(g.length-1)*s.t,i=Math.floor(n),pts=g.slice(0,i+1);
    if(i<g.length-1)pts.push(d3.geoInterpolate(g[i],g[i+1])(n-i));eRt[k].setAttribute('d',path({type:'LineString',coordinates:pts})||'');eRt[k].setAttribute('opacity',s.o)}
  const nv=$('#navio');nv.setAttribute('opacity',S.navio.o);if(S.navio.rota&&S.navio.o>0){const g=geo(S.navio.rota),t=S.rt[S.navio.rota].t,n=(g.length-1)*Math.min(t,.999),i=Math.floor(n),f=d3.geoInterpolate(g[i],g[i+1]);
    const a=proj(f(n-i)),b=proj(f(Math.min(1,n-i+.05)));nv.setAttribute('transform',`translate(${a[0]},${a[1]-6+Math.sin(tempo*2)*3}) scale(${b[0]<a[0]?-1.4:1.4},1.4)`)}
  const sv=xy('savannah');eMancha.setAttribute('cx',sv[0]);eMancha.setAttribute('cy',sv[1]);eMancha.setAttribute('r',S.mancha.r);
  gF.setAttribute('opacity',S.frank.o);if(S.frank.o>0){const[fx,fy]=xy('filadelfia'),R=S.frank.t*420;
    eSemi.setAttribute('d',`M${fx-R},${fy} A${R},${R} 0 0 1 ${fx+R},${fy} Z`);eRaio.setAttribute('x1',fx);eRaio.setAttribute('y1',fy);eRaio.setAttribute('x2',fx+R*Math.cos(-.6));eRaio.setAttribute('y2',fy+R*Math.sin(-.6));
    for(const p of gente){const vis=p.r<=S.frank.t?1:0;p.e.setAttribute('cx',fx+Math.cos(p.a)*p.r*420*.97);p.e.setAttribute('cy',fy+Math.sin(p.a)*p.r*420*.97);p.e.setAttribute('opacity',vis*.75)}}
}
gsap.ticker.add(()=>desenha(false));

/* ---------- som ---------- */
let mudo=false,silencio=false,musica,amb={};const SFX='assets/sfx/';
function som(n,v=.4){if(silencio||mudo)return;const a=new Audio(SFX+n);a.volume=v;a.play().catch(()=>{})}
['mar','multidao'].forEach(n=>{const a=new Audio(SFX+n+'.mp3');a.loop=true;a.volume=0;amb[n]=a});
function ambiente(n){for(const k in amb){const a=amb[k],alvo=(k==n&&!mudo)?(k=='mar'?.35:.3):0;if(alvo>0&&a.paused)a.play().catch(()=>{});gsap.to(a,{volume:alvo,duration:silencio?0:2.5,onComplete:()=>{if(alvo==0)a.pause()}})}}
function trilha(v){if(!musica){musica=new Audio(SFX+'trilha.mp3');musica.loop=true;musica.volume=0;musica.play().catch(()=>{})}gsap.to(musica,{volume:mudo?0:v,duration:3})}

/* ---------- texto e imagem ---------- */
const TX=$('#txt');
function limpa(){[...TX.children].forEach(c=>{if(silencio){c.remove();return}gsap.to(c,{opacity:0,y:'-=12',duration:.5,onComplete:()=>c.remove()})})}
function T(html,x,y,cls='p',w=760,extra=''){const d=document.createElement('div');d.className=cls;d.innerHTML=html;d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;${extra}`;TX.appendChild(d);return d}
function med(src,x,y,s,cap){const d=document.createElement('div');d.style.cssText=`left:${x}px;top:${y}px;width:${s}px`;d.innerHTML=`<div class="med" style="width:${s}px;height:${s}px;background-image:url(${src})"></div>`+(cap?`<div class="med-cap" style="margin-top:22px">${cap}</div>`:'');TX.appendChild(d);return d}
function entra(tl,e,at,d=1,dy=30){tl.fromTo(e,{opacity:0,y:dy},{opacity:1,y:0,duration:d,ease:'power3.out'},at);return e}
function letras(tl,e,at,dur=2.2){const t=e.innerHTML;e.innerHTML=t.replace(/(<[^>]+>)|([^<])/g,(m,tag,ch)=>tag?tag:`<span>${ch}</span>`);tl.fromTo(e,{opacity:1},{opacity:1,duration:.01},at);tl.fromTo(e.querySelectorAll('span'),{opacity:0},{opacity:1,duration:.05,stagger:dur/e.querySelectorAll('span').length,ease:'none'},at);return e}
function conta(tl,e,ate,at,dur=2.5,suf=''){const o={v:0};tl.fromTo(o,{v:0},{v:ate,duration:dur,ease:'power2.out',onUpdate:()=>e.textContent=Math.round(o.v).toLocaleString('pt-BR')+suf},at);return e}
let imgAtual=null,imgEl=null;
function imagem(nome,ancora){
  if(nome==imgAtual)return;const velho=imgEl,anV=imgAtual&&IMG[imgAtual].a;
  if(velho){if(silencio)velho.remove();else{const[x,y]=anV?xy(anV):[W/2,H/2];const o={r:150};gsap.to(o,{r:0,duration:1.1,ease:'power3.in',onUpdate:()=>velho.style.clipPath=`circle(${o.r}% at ${x}px ${y}px)`,onComplete:()=>velho.remove()});som('whoosh2.wav',.25)}}
  imgAtual=nome;imgEl=null;if(!nome)return;
  const d=document.createElement('div');d.className='quadro kb';d.style.backgroundImage=`url(${IMG[nome].src})`;$('#img').appendChild(d);imgEl=d;
  const[x,y]=IMG[nome].a?xy(IMG[nome].a):[W/2,H/2];
  if(silencio){d.style.clipPath='none';return}

/* ---------- motor ---------- */
let atual=-1,tlAtual=null;
function monta(i){const p=PASSOS[i],tl=gsap.timeline({paused:true});if(!silencio)ambiente(p.amb||null);p.f(tl);imagem(p.img||null);return tl}
function zera(){gsap.globalTimeline.getChildren().forEach(t=>t.kill());TX.innerHTML='';$('#img').innerHTML='';imgAtual=null;imgEl=null;novoS();
  [...$('#selos').children].forEach(s=>s.className='selo');gsap.set('#selos',{opacity:0});gsap.set('#gMapa,#gRotas,#gOndas,#gPontos,#gNavio',{opacity:1});gsap.set('#flash',{opacity:0})}
function vaiPara(n,animar){n=Math.max(0,Math.min(PASSOS.length-1,n));
  if(animar&&n==atual+1){if(tlAtual){silencio=true;tlAtual.progress(1,false);silencio=false}atual=n;tlAtual=monta(n);tlAtual.play()}
  else{zera();silencio=true;for(let i=0;i<=n;i++){const t=monta(i);t.progress(1,false);t.kill()}silencio=false;ambiente(PASSOS[n].amb||null);atual=n;tlAtual=null}
  $('#prog').style.width=((atual+1)/PASSOS.length*100)+'%';$('#notas').innerHTML=`<b>${atual+1}/${PASSOS.length}</b> · ${PASSOS[atual].n}`;try{location.hash=atual+1}catch(e){}}
let comecou=false;
function comeca(n=0){if(comecou)return;comecou=true;const ini=$('#inicio');ini.style.transition='opacity 1s';ini.style.opacity=0;setTimeout(()=>ini.remove(),1100);if(n>0){trilha(.14);vaiPara(n,false)}else vaiPara(0,true)}
addEventListener('keydown',e=>{const k=e.key;
  if(!comecou){if(['ArrowRight',' ','PageDown','Enter'].includes(k)){comeca(parseInt(location.hash.slice(1)||'1')-1);e.preventDefault()}return}
  if(['ArrowRight',' ','PageDown','Enter'].includes(k)){vaiPara(atual+1,true);e.preventDefault()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){vaiPara(atual-1,false);e.preventDefault()}
  else if(k=='Home')vaiPara(0,false);
  else if(k=='f'||k=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(k=='n'||k=='N'){const s=$('#notas');s.style.display=s.style.display=='block'?'none':'block'}
  else if(k=='m'||k=='M'){mudo=!mudo;if(musica)musica.volume=mudo?0:.14;ambiente(mudo?null:PASSOS[atual].amb||null)}
  else if(k=='c'||k=='C'){document.body.classList.toggle('cursor')}});
addEventListener('click',()=>{if(!comecou)comeca(parseInt(location.hash.slice(1)||'1')-1)});
// toque: metade direita avança, metade esquerda volta; arrastar para a esquerda ou para cima avança
const telaCheia=()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)};
function avanca(){comecou?vaiPara(atual+1,true):comeca(parseInt(location.hash.slice(1)||'1')-1)}
function recua(){if(comecou)vaiPara(atual-1,false)}
$('#nav-ant').addEventListener('click',e=>{e.stopPropagation();recua()});$('#nav-prox').addEventListener('click',e=>{e.stopPropagation();avanca()});$('#nav-tela').addEventListener('click',e=>{e.stopPropagation();telaCheia()});
let tx=null,ty=null;
addEventListener('touchstart',e=>{if(e.touches.length!==1)return tx=null;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null||e.target.closest('#nav'))return tx=null;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,dist=Math.max(Math.abs(dx),Math.abs(dy));tx=null;e.preventDefault();
  if(dist<12)return t.clientX>innerWidth/3?avanca():recua();
  if(dist<50)return;(Math.abs(dx)>Math.abs(dy)?dx<0:dy<0)?avanca():recua()},{passive:false});
addEventListener('orientationchange',()=>setTimeout(ajusta,300));if(window.visualViewport)visualViewport.addEventListener('resize',ajusta);
</script>

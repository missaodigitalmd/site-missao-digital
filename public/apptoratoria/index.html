<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>A Última Cidade</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ink:#06080b; --ice:#9fb4c4; --ice2:#dfe8ee; --snow:#f4f8fb;
  --amber:#ffb347; --amber2:#e8761c; --rust:#c2412b; --card:rgba(62,72,82,.82);
  --slab:'Roboto Slab',Georgia,serif; --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--snow)}
body{cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--ink);transform-origin:center center}
.layer{position:absolute;inset:0}
img.full,video.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* mundo */
#world{transform-origin:50% 42%}
#heat{position:absolute;left:50%;top:453px;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,179,71,.55) 0%,rgba(232,118,28,.25) 30%,rgba(232,118,28,0) 62%);mix-blend-mode:screen;opacity:0}
#roads{position:absolute;inset:0;width:100%;height:100%}
#dark{background:#000;opacity:0;pointer-events:none}
#frost{pointer-events:none;opacity:0;background-size:cover;mix-blend-mode:screen}
#vignette{pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%)}
#grain{pointer-events:none;opacity:.08;mix-blend-mode:overlay}
#flash{background:#fff;opacity:0;pointer-events:none}
#redflash{background:radial-gradient(ellipse,rgba(194,65,43,0) 30%,rgba(194,65,43,.7));opacity:0;pointer-events:none}

/* mascara de tinta */
.ink{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:0% 0%;mask-size:0% 0%}

/* tipografia */
.title{position:absolute;left:0;right:0;text-align:center;font-family:var(--slab);font-weight:900;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.02;text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 2px #000}
.kicker{font-family:var(--cond);font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--ice);text-shadow:0 2px 12px #000}
.rule{display:block;height:2px;width:520px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--ice2),transparent)}
.amber{color:var(--amber)} .rust{color:#ff6b4a}

/* HUD */
#hud{pointer-events:none}
#thermo{position:absolute;left:50%;top:-220px;width:210px;height:210px;margin-left:-105px}
#thermo .dial{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#1b232b 55%,#0b0f13 70%);
  border:3px solid #6f7f8c;box-shadow:0 0 0 8px rgba(0,0,0,.6),0 10px 40px #000}
#thermo .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--slab);font-weight:900;font-size:74px;letter-spacing:-.02em}
#thermo .unit{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:var(--cond);font-size:26px;letter-spacing:.2em;color:var(--ice)}
#thermo svg{position:absolute;inset:-14px;width:238px;height:238px}
#day{position:absolute;left:calc(50% + 140px);top:116px;font-family:var(--slab);font-weight:700;font-size:34px;letter-spacing:.18em;color:var(--snow);opacity:0;white-space:nowrap;
  padding:8px 26px 8px 34px;background:linear-gradient(90deg,rgba(10,14,18,.9),rgba(10,14,18,.55));border-top:1px solid rgba(223,232,238,.5);border-bottom:1px solid rgba(223,232,238,.5);box-shadow:0 8px 24px rgba(0,0,0,.6)}
#day::before{content:'';position:absolute;left:-14px;top:50%;width:22px;height:2px;background:rgba(223,232,238,.7)}
#toast{position:absolute;left:50%;top:40px;transform:translateX(-50%);font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.25em;color:var(--ice2);background:rgba(0,0,0,.6);padding:8px 20px;opacity:0;z-index:60}
#pop{position:absolute;right:56px;top:46px;font-family:var(--cond);font-weight:600;font-size:34px;letter-spacing:.12em;opacity:0;text-align:right}
#pop b{font-family:var(--slab);font-size:64px;display:block;line-height:1;color:var(--snow)}
#bars{position:absolute;left:50%;bottom:-240px;width:1500px;margin-left:-750px;display:flex;gap:80px;justify-content:center}
.bar{width:660px}
.bar .lbl{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--cond);font-weight:700;font-size:38px;letter-spacing:.18em;margin-bottom:10px;text-shadow:0 2px 10px #000}
.bar .lbl .n{font-family:var(--slab);font-weight:900;font-size:50px;letter-spacing:0}
.bar .lbl .d{font-family:var(--slab);font-weight:900;font-size:44px;margin-left:16px;opacity:0}
.bar .track{position:relative;height:44px;border:2px solid rgba(223,232,238,.7);background:rgba(0,0,0,.6);box-shadow:0 0 0 5px rgba(0,0,0,.45),0 8px 30px #000;overflow:hidden}
.bar .fill,.bar .ghost{position:absolute;left:0;top:0;bottom:0;width:0}
.bar .ghost{opacity:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 10px,rgba(255,255,255,.2) 10px 20px)}
#hope .fill{background:linear-gradient(90deg,#a85a12,var(--amber));box-shadow:0 0 30px rgba(255,179,71,.7)}
#disc .fill{background:linear-gradient(90deg,#5e1a10,var(--rust));box-shadow:0 0 30px rgba(194,65,43,.7)}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.5)}

/* cartao de evento */
#ui{pointer-events:none}
#ui *{pointer-events:auto}
.card{position:absolute;left:50%;top:300px;width:1560px;margin-left:-780px;background:var(--card);
  backdrop-filter:blur(6px);border:2px solid rgba(223,232,238,.55);outline:1px solid rgba(223,232,238,.25);outline-offset:-14px;
  box-shadow:0 30px 90px rgba(0,0,0,.85);display:flex;gap:56px;padding:56px 64px 50px}
.card .orn{position:absolute;width:90px;height:90px;opacity:.75}
.card .seal{position:absolute;left:50%;top:-62px;margin-left:-62px;width:124px;height:124px;border-radius:50%;
  background:radial-gradient(circle,#f3f1ea 50%,#cfcabd 72%);border:5px solid #c9a24a;box-shadow:0 0 0 3px #3b3222,inset 0 0 0 3px #e8d9a8,0 8px 30px #000;display:grid;place-items:center;z-index:2}
.card .seal::before{content:'';position:absolute;inset:-20px;border-radius:50%;z-index:-1;background:repeating-conic-gradient(#b8913d 0 7deg,transparent 7deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card .seal svg{width:66px;height:66px}
.portrait{flex:none;width:340px;height:440px;border:2px solid rgba(223,232,238,.5);position:relative;overflow:hidden;background:#111}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .stamp{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--slab);font-weight:900;font-size:70px;
  padding:10px 24px;border:6px solid currentColor;text-transform:uppercase;white-space:nowrap;opacity:0;background:rgba(0,0,0,.35)}
.portrait .tag{position:absolute;left:50%;top:-40px;transform:translateX(-50%);transform-origin:50% 0;opacity:0}
.body{flex:1;display:flex;flex-direction:column}
.body h2{font-family:var(--slab);font-weight:900;font-size:76px;text-transform:uppercase;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.body .sub{font-family:var(--cond);font-weight:600;font-size:34px;letter-spacing:.25em;color:var(--ice2);margin-bottom:16px;text-transform:uppercase}
.facts{display:flex;flex-wrap:wrap;gap:18px;margin-top:28px;overflow:hidden}
.fact{font-family:var(--cond);font-weight:700;font-size:46px;letter-spacing:.06em;text-transform:uppercase;padding:14px 30px;
  background:rgba(0,0,0,.45);border-left:6px solid var(--amber);opacity:0}
.fact.cold{border-left-color:var(--ice)}
.opts{display:flex;flex-direction:column;gap:16px;padding-top:24px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;font-family:var(--slab);font-weight:700;font-size:44px;text-transform:uppercase;
  color:#1a1f24;background:linear-gradient(#f6f7f6,#d9dcdc);padding:18px 60px;cursor:pointer;opacity:0;
  clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%);transition:filter .15s}
.opt .k{font-family:var(--cond);font-size:30px;letter-spacing:.2em;color:#5a6670}
.opt.sel{background:linear-gradient(#ffd08a,var(--amber));filter:drop-shadow(0 0 22px rgba(255,179,71,.9))}
.opt .eff{font-family:var(--cond);font-weight:700;font-size:34px;letter-spacing:.06em;white-space:nowrap}
.opt .eff .h{color:#8a4b00}.opt .eff .dd{color:#8e2414;margin-left:18px}

/* livro de leis */
.book{position:absolute;left:50%;top:170px;width:1400px;height:700px;margin-left:-700px;display:flex;perspective:2400px}
.page{flex:1;background:linear-gradient(90deg,#d8d2c2,#efe9da);color:#2a2620;padding:60px 64px;box-shadow:0 30px 80px #000;position:relative}
.page.l{transform-origin:right center;border-right:2px solid #9b9280}
.page.r{transform-origin:left center}
.page h3{font-family:var(--slab);font-weight:900;font-size:58px;text-transform:uppercase;margin-bottom:26px}
.law{font-family:var(--slab);font-weight:700;font-size:40px;padding:14px 0;border-bottom:1px solid #b3aa95;display:flex;justify-content:space-between;opacity:0}
.law i{font-style:normal;white-space:nowrap;margin-left:16px;font-family:var(--cond);font-size:32px;letter-spacing:.08em}
.law .s{color:#2f6b2f}.law .c{color:#9d2a17}
.bigstamp{position:absolute;font-family:var(--slab);font-weight:900;text-transform:uppercase;border:10px solid currentColor;padding:14px 40px;opacity:0;white-space:nowrap}

/* botao do jogo */
.gamebtn{position:absolute;left:50%;transform:translateX(-50%);min-width:900px;text-align:center;font-family:var(--slab);font-weight:700;font-size:54px;
  text-transform:uppercase;padding:26px 60px;background:linear-gradient(rgba(40,60,72,.9),rgba(20,32,40,.9));border:2px solid rgba(223,232,238,.6);outline:1px solid rgba(223,232,238,.3);outline-offset:6px;box-shadow:0 20px 60px #000}

#restart{position:absolute;right:30px;bottom:26px;font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.2em;color:rgba(223,232,238,.55);
  background:rgba(0,0,0,.4);border:1px solid rgba(223,232,238,.3);padding:8px 16px;cursor:pointer;display:none;z-index:50}
#restart:hover{color:#fff}
#hint{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-family:var(--cond);font-size:28px;letter-spacing:.3em;color:rgba(223,232,238,.5)}
#cursorhide{cursor:none}
</style>
</head>
<body>
<div id="stage">
  <!-- mundo -->
  <div id="world" class="layer">
    <img id="cityimg" class="full" src="assets/cidade.jpg" alt="">
    <div id="heat"></div>
    <svg id="roads" viewBox="0 0 1920 1080"></svg>
    <canvas id="people" class="layer" width="1920" height="1080"></canvas>
  </div>
  <img id="genimg" class="full" src="assets/gerador.jpg" alt="" style="opacity:0">
  <img id="houseimg" class="full" src="assets/casa.jpg" alt="" style="opacity:0">
  <video id="intro" class="full ink" src="video/abertura-web.mp4" muted playsinline preload="auto"></video>
  <video id="endvid" class="full" playsinline preload="auto" style="opacity:0"></video>
  <div id="dark" class="layer"></div>
  <canvas id="snow" class="layer" width="1920" height="1080" style="pointer-events:none"></canvas>
  <div id="frost" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <canvas id="grain" class="layer" width="480" height="270"></canvas>
  <div id="redflash" class="layer"></div>

  <div id="hud" class="layer">
    <div id="thermo"><svg viewBox="0 0 238 238"><circle cx="119" cy="119" r="112" fill="none" stroke="rgba(159,180,196,.25)" stroke-width="6"/>
      <circle id="tarc" cx="119" cy="119" r="112" fill="none" stroke="#9fb4c4" stroke-width="6" stroke-dasharray="704" stroke-dashoffset="350" transform="rotate(-90 119 119)"/></svg>
      <div class="dial"></div><div class="val" id="tval">-20</div><div class="unit">°C</div></div>
    <div id="day">DIA 1</div>
    <div id="pop">PESSOAS<b id="popn">80</b></div>
    <div id="bars">
      <div class="bar" id="hope"><div class="lbl"><span>ESPERANÇA<span class="d"></span></span><span class="n">0</span></div><div class="track"><div class="ghost"></div><div class="fill"></div></div></div>
      <div class="bar" id="disc"><div class="lbl"><span>DESCONTENTAMENTO<span class="d"></span></span><span class="n">0</span></div><div class="track"><div class="ghost"></div><div class="fill"></div></div></div>
    </div>
  </div>

  <div id="ui" class="layer"></div>
  <div id="flash" class="layer"></div>
  <div id="toast"></div>
  <button id="restart">↺ RECOMEÇAR</button>
  <div id="hint">ESPAÇO PARA COMEÇAR</div>
</div>

<script src="lib/gsap.min.js"></script>
<script>
// ---------- palco ----------
const $=s=>document.querySelector(s), stage=$('#stage'), ui=$('#ui');
function fit(){gsap.set(stage,{xPercent:-50,yPercent:-50,scale:Math.min(innerWidth/1920,innerHeight/1080)})}
addEventListener('resize',fit);
const W=1920,H=1080,CX=960,CY=453; // gerador medido na cidade.png

// ---------- som ----------
const S={};['vento','boom','whoosh','riser','coracao','sino','clique'].forEach(n=>{S[n]=new Audio('sons/'+n+'.mp3');S[n].preload='auto'});
S.vento.loop=true;S.coracao.loop=true;
let MUTED=false;
function toggleMute(){MUTED=!MUTED;Object.values(S).forEach(a=>a.muted=MUTED);$('#endvid').muted=MUTED;const t=$('#toast');t.textContent=MUTED?'SOM DESLIGADO':'SOM LIGADO';gsap.fromTo(t,{opacity:1},{opacity:0,duration:.6,delay:1.2})}
function sfx(n,v=.8){if(MUTED)return;const a=S[n].cloneNode();a.volume=v;a.play().catch(()=>{})}
function amb(n,v,d=2){const a=S[n];if(a.paused&&v>0){a.volume=0;a.play().catch(()=>{})}gsap.to(a,{volume:v,duration:d,onComplete:()=>{if(v===0)a.pause()}})}

// ---------- texturas geradas ----------
function inkMask(seed=1){ // mancha de tinta com respingos, usada como mascara
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');let r=seed*9301;
  const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  g.fillStyle='#000';g.beginPath();g.arc(256,256,150,0,7);g.fill();
  for(let i=0;i<70;i++){const a=rnd()*6.283,d=120+rnd()*70,s=10+rnd()*55;g.beginPath();g.arc(256+Math.cos(a)*d,256+Math.sin(a)*d,s,0,7);g.fill()}
  for(let i=0;i<140;i++){const a=rnd()*6.283,d=190+rnd()*60,s=1+rnd()*7;g.beginPath();g.arc(256+Math.cos(a)*d,256+Math.sin(a)*d,s,0,7);g.fill()}
  return c.toDataURL();
}
const INK=inkMask(3);
document.querySelectorAll('.ink').forEach(e=>{e.style.webkitMaskImage=e.style.maskImage=`url(${INK})`});
function frostTex(){ // cristais de geada nascendo das bordas
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const grd=g.createRadialGradient(CX,CY,300,CX,CY,1150);grd.addColorStop(0,'rgba(200,225,240,0)');grd.addColorStop(.55,'rgba(200,225,240,.25)');grd.addColorStop(1,'rgba(235,245,252,.95)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);g.strokeStyle='rgba(240,250,255,.35)';g.shadowColor='rgba(220,240,255,.9)';g.shadowBlur=6;
  function br(x,y,a,l,d){if(d>6||l<6)return;const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;g.lineWidth=Math.max(.6,3-d*.4);g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
    br(x2,y2,a+(Math.random()-.5)*.5,l*.82,d+1);if(Math.random()<.6)br(x2,y2,a+(Math.random()<.5?1:-1)*(.5+Math.random()*.6),l*.55,d+1)}
  for(let i=0;i<70;i++){const e=Math.random()*4|0;let x,y;if(e==0){x=Math.random()*W;y=0}else if(e==1){x=W;y=Math.random()*H}else if(e==2){x=Math.random()*W;y=H}else{x=0;y=Math.random()*H}
    br(x,y,Math.atan2(CY-y,CX-x)+(Math.random()-.5)*1.2,22+Math.random()*40,0)}
  return c.toDataURL();
}
$('#frost').style.backgroundImage=`url(${frostTex()})`;
// grao
(function(){const c=$('#grain'),g=c.getContext('2d');function f(){const d=g.createImageData(480,270);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);setTimeout(()=>requestAnimationFrame(f),70)}f()})();

// ---------- neve ----------
const snow={amt:.35,wind:1};const flakes=[];for(let i=0;i<900;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()});
(function(){const c=$('#snow'),g=c.getContext('2d');function f(){g.clearRect(0,0,W,H);const n=Math.floor(flakes.length*snow.amt);
  for(let i=0;i<n;i++){const p=flakes[i];const sp=(2+p.z*9);p.x+=sp*1.1*snow.wind;p.y+=sp*.7;if(p.x>W+20){p.x=-20;p.y=Math.random()*H}if(p.y>H+20){p.y=-20;p.x=Math.random()*W-200}
    g.strokeStyle=`rgba(240,248,255,${.25+p.z*.6})`;g.lineWidth=1+p.z*2.4;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-sp*1.6*snow.wind,p.y-sp);g.stroke()}
  requestAnimationFrame(f)}f()})();

// ---------- ruas radiais (viram a cruz) ----------
const roads=$('#roads');const RAD=[];
for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2;const L=i%2?620:[330,0,400,0,640,0,400][i]; // braços pares formam uma cruz latina
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',CX);l.setAttribute('y1',CY);
  l.setAttribute('x2',CX+Math.cos(a)*L);l.setAttribute('y2',CY+Math.sin(a)*L);l.setAttribute('stroke','#ffb347');l.setAttribute('stroke-width',6);
  l.setAttribute('stroke-linecap','round');l.style.opacity=0;l.style.filter='drop-shadow(0 0 12px #ffb347)';roads.appendChild(l);RAD.push(l)}

// ---------- pessoas ----------
const ppl={alive:1,grey:0,list:[],walkers:[]};
for(let i=0;i<150;i++){ppl.list.push({r:150+Math.random()*300,a:Math.random()*6.283,s:(Math.random()-.5)*.004,on:0})}
function walker(n,color,dir){ // pessoas saindo da cidade por uma rua
  for(let i=0;i<n;i++)ppl.walkers.push({a:dir,r:130-i*24,v:1.1+Math.random()*.3,c:color,o:1})}
(function(){const c=$('#people'),g=c.getContext('2d');function f(){g.clearRect(0,0,W,H);
  for(const p of ppl.list){if(!p.on)continue;p.a+=p.s*ppl.alive;const x=CX+Math.cos(p.a)*p.r,y=CY+Math.sin(p.a)*p.r*.8;
    g.fillStyle=ppl.grey?`rgba(150,165,175,${p.on})`:`rgba(255,214,150,${p.on})`;g.beginPath();g.arc(x,y,3.4,0,7);g.fill()}
  for(const w of ppl.walkers){w.r+=w.v*1.6;if(w.r>620)w.o-=.01;if(w.r<0||w.o<=0)continue;const x=CX+Math.cos(w.a)*w.r,y=CY+Math.sin(w.a)*w.r;
    g.fillStyle=w.c.replace('A',Math.max(0,w.o));g.shadowColor=w.c.replace('A',1);g.shadowBlur=10;g.beginPath();g.arc(x,y,9,0,7);g.fill();g.shadowBlur=0}
  ppl.walkers=ppl.walkers.filter(w=>w.o>0);requestAnimationFrame(f)}f()})();
function peopleOn(v=1,d=2){ppl.list.forEach((p,i)=>gsap.to(p,{on:v,duration:.4,delay:Math.random()*d}))}

// ---------- estado do jogo ----------
const START={hope:55,disc:30,pop:80};let G={...START,harsh:0,choices:[]};
const hud={hope:0,disc:0,pop:80,temp:-20};
function setBarsInstant(){['hope','disc'].forEach(k=>{$(`#${k} .fill`).style.width=Math.max(0,Math.min(100,hud[k]))+'%';$(`#${k} .n`).textContent=Math.round(Math.max(0,Math.min(100,hud[k])))})}
gsap.ticker.add(()=>{setBarsInstant();$('#tval').textContent=Math.round(hud.temp);$('#popn').textContent=Math.round(hud.pop);
  $('#tarc').setAttribute('stroke-dashoffset',704-704*Math.min(1,Math.abs(hud.temp)/80))});
function barsTo(h,d,dur=1.6,ease='elastic.out(1,.45)'){return gsap.to(hud,{hope:h,disc:d,duration:dur,ease})}

function ghost(k,cur,nxt,delta){
  const gEl=$(`#${k} .ghost`),dEl=$(`#${k} .d`);gsap.killTweensOf([gEl,dEl]);
  const lo=Math.min(cur,nxt),hi=Math.max(cur,nxt);
  gsap.set(gEl,{left:lo+'%',width:(hi-lo)+'%'});
  gsap.fromTo(gEl,{opacity:1},{opacity:.25,duration:.35,repeat:-1,yoyo:true});
  dEl.textContent=(delta>0?'+':'')+delta;dEl.style.color=(k==='hope'?delta>=0:delta<=0)?'#ffd08a':'#ff6b4a';
  gsap.fromTo(dEl,{opacity:0,y:20,scale:1.6},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(3)'});

}

function restoreCity(){ppl.grey=0;ppl.alive=1;peopleOn(1,.8);gsap.to('#heat',{opacity:1,duration:1});gsap.to('#frost',{opacity:.45,duration:1});gsap.to('#cityimg',{opacity:1,duration:1});

function exitEnding(){const v=$('#endvid');v.onended=null;gsap.to(v,{opacity:0,duration:1,onComplete:()=>v.pause()});gsap.to('#genimg',{opacity:0,duration:1});$('#restart').style.display='none';hudShow(false)}

// ---------- navegacao ----------
let cur=0;
function go(i){if(i<0||i>=BEATS.length)return;
  const b=BEATS[cur];if(b.vote!==undefined&&!(voteState&&voteState.done)&&i>cur)return; // espera a decisao
  if(i<cur){gsap.globalTimeline.getChildren(false,true,false).forEach(t=>{if(t.vars&&t.vars.repeat!==-1)t.progress(1)})}
  cur=i;killPending();BEATS[i].f()}
function restart(){G={...START,harsh:0,choices:[]};voteState=null;exitEnding();clearUI();
  gsap.to('#dark',{opacity:.35,duration:1});gsap.to('#cityimg',{opacity:1,duration:1});gsap.to('#frost',{opacity:.45,duration:1});
  hudShow(true);hud.pop=80;barsTo(START.hope,START.disc,1.2,'power2.out');
  const k=BEATS.findIndex(b=>b.vote===0)-1;cur=k;killPending();BEATS[k].f()}
$('#restart').onclick=ev=>{ev.stopPropagation();restart()};
// toque: terço da esquerda volta, o resto avança (na votação, tocar a opção mostra o preço e tocar de novo confirma)
if(matchMedia('(pointer:coarse)').matches)stage.addEventListener('click',ev=>{if(ev.target.closest('.opt'))return;ev.clientX<innerWidth/3?go(cur-1):go(cur+1)});
addEventListener('keydown',e=>{
  if([' ','ArrowRight','PageDown','ArrowDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(['1','2','3'].includes(e.key))preview(+e.key-1);
  else if(e.key==='Enter')decide();
  else if(e.key==='r'||e.key==='R')restart();
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='m'||e.key==='M')toggleMute();
  else if(e.key==='h'||e.key==='H')document.body.style.cursor=document.body.style.cursor==='none'?'default':'none';
});
fit();
// salto direto para uma batida: index.html#12
BEATS[0].f();
if(location.hash){const k=parseInt(location.hash.slice(1));if(k>0){$('#hint').style.display='none';for(let i=1;i<=k;i++){cur=i;killPending();BEATS[i].f()}gsap.globalTimeline.getChildren(true,true,false).forEach(t=>{if(t.vars.repeat!==-1)t.progress(1)})}}
